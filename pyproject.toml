[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bspc-eeg-core"
version = "0.1.0"
description = "Core CondDiffEEG and CGODE-CCT model implementations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "torch>=2.5,<2.8",
]

[tool.setuptools.packages.find]
include = ["bspc_eeg*"]
